[project]
name = "pyrow"
version = "0.1.0"
description = "Visual rowing workout pacer with animated stroke guidance"
readme = "README.md"
license = "MIT"
authors = [
    { name = "JorgeMira" },
]
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "pygame-ce>=2.5.7",
]

[project.scripts]
pyrow = "main:main"

[dependency-groups]
dev = [
    "prek>=0.4.12",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "sphinx>=8.0.0",
    "ty>=0.0.66",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the app runs from the repo root; no package install step
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]
ignore = [
    "SIM105", # contextlib.suppress — try/except pass is clearer for field parsing
]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.14"
